            - "Q"
            - "R"
            - "S"
            - "T"
            - "U"
            - "V"
            - "W"
            - "X"
    pattern:
      name: Pattern
      description: 126-character pattern (18x7 grid) using R, G, Y, B for colors
      required: true
      selector:
        text:
          multiline: true

delete_graphic:
  name: Delete Graphic
  description: Delete a specific graphic block or all graphics
  fields:
