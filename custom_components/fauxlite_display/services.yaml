            - "P"
            - "Q"
            - "R"
            - "S"
            - "T"
            - "U"
            - "V"
            - "W"
            - "X"

set_speed:
  name: Set Speed
  description: Set the scroll speed (A=fastest, Z=slowest or 0-25)
  fields:
    speed:
      name: Speed
      description: Speed value (A-Z or 0-25, where 0 is fastest)
      required: true
      selector:
        number:
          min: 0
          max: 25
          step: 1

set_time:
  name: Set Time
  description: Sync the display's internal clock with the current system time

create_graphic:
  name: Create Graphic
  description: Create a custom graphic block (18x7 dots)
  fields:
    block:
      name: Block
      description: Graphic block letter (A-X, Y and Z reserved)
      required: true
      selector:
        select:
          options:
            - "A"
            - "B"
            - "C"
            - "D"
