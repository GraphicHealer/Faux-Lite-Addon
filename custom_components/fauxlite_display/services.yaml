delete_page:
  name: Delete Page
  description: Delete a specific page or all pages
  fields:
    page:
      name: Page
      description: Page to delete (A-Z or * for all)
      required: false
      default: "*"
      selector:
        text:

run_page:
  name: Run Page
  description: Run a specific page now
  fields:
    page:
      name: Page
      description: Page to run (A-X, Y and Z reserved)
      required: true
      selector:
        select:
          options:
            - "A"
            - "B"
            - "C"
            - "D"
            - "E"
            - "F"
            - "G"
            - "H"
            - "I"
            - "J"
            - "K"
