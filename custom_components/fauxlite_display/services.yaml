send_message:
  name: Send Message
  description: Send a one-shot message that displays and then clears (uses hidden pages Y and Z)
  fields:
    text:
      name: Text
      description: The text message to display
      required: true
      selector:
        text:
          multiline: true
    color:
      name: Color
      description: Color for the text
      required: false
      selector:
        select:
          options:
            - "dim_red"
            - "red"
            - "bright_red"
            - "orange"
            - "bright_orange"
            - "light_yellow"
            - "yellow"
            - "bright_yellow"
            - "lime"
            - "dim_lime"
            - "bright_lime"
            - "bright_green"
            - "green"
            - "dim_green"
            - "yel_grn_red"
            - "rainbow"
            - "red_grn_3d"
            - "red_yel_3d"
            - "grn_red_3d"
            - "grn_yel_3d"
            - "grn_on_red"
            - "red_on_grn"
            - "org_on_grn_3d"
            - "lime_on_red_3d"
            - "grn_on_red_3d"
            - "red_on_grn_3d"
    font:
      name: Font
      description: Font style for the text
      required: false
      selector:
        select:
          options:
            - "normal"
            - "bold"
            - "italic"
            - "bold_italic"
            - "flash_normal"
            - "flash_bold"
            - "flash_italic"
            - "flash_bold_italic"
    size:
      name: Size
      description: Character size
      required: false
      selector:
        select:
          options:
            - "5x7"
            - "4x7"
    function:
      name: Function
      description: Display function/animation
      required: false
      selector:
        select:
          options:
            - "auto"
            - "open"
            - "cover"
            - "cycling"
            - "close_right"
            - "close_left"
            - "close_both"
            - "scroll_up"
            - "scroll_down"
            - "overlap"
            - "stacking"
            - "appear"
            - "random"
            - "shift_left"
            - "magic"
    exit_function:
      name: Exit Function
      description: Function/animation to use when returning to blank page (optional, defaults to same as Function)
      required: false
      selector:
        select:
          options:
            - "auto"
            - "open"
            - "cover"
            - "cycling"
            - "close_right"
            - "close_left"
            - "close_both"
            - "scroll_up"
            - "scroll_down"
            - "overlap"
            - "stacking"
            - "appear"
            - "random"
            - "shift_left"
            - "magic"
    beep:
      name: Beep
      description: Enable audible beep with this message
      required: false
      default: false
      selector:
        boolean:
    repeat:
      name: Repeat
      description: Number of times to display the message before clearing
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 99
          step: 1

send_formatted_message:
  name: Send Formatted Message
  description: Send a multi-segment message with different colors, fonts, and effects per segment (WYSIWYG-style)
  fields:
    page:
      name: Page
      description: Page to send the message to (A-Z)
      required: false
      default: "A"
      example: "A"
      selector:
        text:
    segments:
      name: Segments
      description: List of text segments, each with their own formatting
      required: true
      example:
        - text: "HELLO "
          color: "bright_red"
          font: "bold"
        - text: "THERE"
          color: "orange"
          font: "italic"
        - graphic: "A"
        - text: " WORLD"
          color: "rainbow"
      selector:
        object:
    function:
      name: Function
      description: Display function/animation for the entire message
      required: false
      example: "scroll_up"
      selector:
        text:

send_raw_protocol:
  name: Send Raw Protocol
  description: Send a raw protocol string directly (for advanced users who want full control)
  fields:
    page:
      name: Page
      description: Page to send the message to (A-Z)
      required: false
      default: "A"
      example: "A"
      selector:
        text:
    protocol_string:
      name: Protocol String
      description: Raw protocol string (without <IDxx> and <Pn> prefix). Example - <CC>HELLO <CE>THERE
      required: true
      example: "<CC>HELLO <CE>THERE"
      selector:
        text:
          multiline: true

send_beep:
  name: Send Beep
  description: Send an audible beep to the display
  fields:
    count:
      name: Count
      description: Number of beeps (1-99)
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 99
          step: 1

show_time:
  name: Show Time
  description: Display the current time on the sign
  fields:
    page:
      name: Page
      description: Page to display time on (A-Z)
      required: false
      default: "A"
      selector:
        text:

show_date:
  name: Show Date
  description: Display the current date on the sign
  fields:
    page:
      name: Page
      description: Page to display date on (A-Z)
      required: false
      default: "A"
      selector:
        text:

pause_display:
  name: Pause Display
  description: Pause the current display
  fields:
    page:
      name: Page
      description: Page to apply pause to (A-Z)
      required: false
      default: "A"
      selector:
        text:

show_thank_you:
