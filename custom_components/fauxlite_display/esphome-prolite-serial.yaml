esphome:
  name: prolite-display
  friendly_name: Prolite Display Bridge
  comment: ESP32 Serial Bridge for Prolite TruColor II Display

esp32:
  board: lolin_s2_mini
  framework:
    type: arduino

logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: !secret api_key
  services:
    - service: send_prolite_command
      variables:
        command: string
      then:
        - uart.write:
            id: prolite_uart
            data: !lambda |-
              std::string cmd = command + "\r\n";
              std::vector<uint8_t> data(cmd.begin(), cmd.end());
              return data;

ota:
  password: !secret ota_password
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: on
  domain: .lan

  manual_ip:
    static_ip: 192.168.77.41
    gateway: 192.168.77.1
    subnet: 255.255.255.0

  ap:
    ssid: AP_${friendly_name}

captive_portal:

web_server:
  port: 80

uart:
  id: prolite_uart
  tx_pin: GPIO18
  rx_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      delimiter: "\n"
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes);

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

switch:
  - platform: restart
    name: "Restart ESP32"
